name: shikodar
description: "موڵک — ئەپی خانووبەرەی کەرکوک"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Localization (ku / ar / en)
  easy_localization: ^3.0.5

  # UI / Media
  cached_network_image: ^3.3.1
  video_player: ^2.10.1
  # Pinned as a direct (not just transitive) dependency: `video_player`
  # 2.10.1's own constraint was satisfied by the older 2.8.15 platform
  # package, so a plain `flutter pub upgrade` never moved past it even
  # though 2.12.x exists.
  video_player_android: ^2.12.0
  # Reels' own player only — everything above stays on video_player.
  # Upgrading video_player_android to 2.12.x did not fix it: on the test
  # device (a Samsung Galaxy S23 Ultra), a Material+InkWell placed
  # directly over the reel video produced literally no ripple on tap —
  # proof the touch never reached Flutter at all in that screen region,
  # regardless of which Dart-side gesture widget wrapped it. That points
  # at video_player_android's SurfaceProducer output surface itself being
  # excluded from normal touch dispatch on this hardware, not at
  # anything fixable by rearranging widgets. media_kit_video renders
  # through a different Android output path (not SurfaceProducer) and
  # doesn't share that failure mode.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  video_compress: ^3.1.4
  video_trimmer: ^5.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Maps — OpenStreetMap based (no API key / billing account needed)
  flutter_map: ^7.0.2
  flutter_map_animations: ^0.7.0
  latlong2: ^0.9.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  image_picker: ^1.0.7

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/branding/
  fonts:
    - family: K24Bold
      fonts:
        - asset: assets/fonts/K24KurdishBold-Bold.ttf
          weight: 700
    - family: Dashling
      fonts:
        - asset: assets/fonts/Quicksand_Dash.otf
    - family: Yellowtail
      fonts:
        - asset: assets/fonts/Yellowtail-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand_Light.otf
          weight: 300
        - asset: assets/fonts/Quicksand_Book.otf
          weight: 400
        - asset: assets/fonts/Quicksand_Bold.otf
          weight: 700
        - asset: assets/fonts/Quicksand_Light_Oblique.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Quicksand_Book_Oblique.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Quicksand_Bold_Oblique.otf
          weight: 700
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans_Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_Light_Italic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/PlusJakartaSans_Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans_Bold_Italic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_transparent.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#F5F0E7"
