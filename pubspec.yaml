name: shikodar
description: "موڵک — ئەپی خانووبەرەی کەرکوک"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Localization (ku / ar / en)
  easy_localization: ^3.0.5

  # UI / Media
  cached_network_image: ^3.3.1
  video_player: ^2.10.1
  # Pinned as a direct (not just transitive) dependency: `video_player`
  # 2.10.1's own constraint was satisfied by the older 2.8.15 platform
  # package, so a plain `flutter pub upgrade` never moved past it even
  # though 2.12.x exists — and 2.8.15 is squarely inside the run of
  # SurfaceProducer releases with reported touch/rendering regressions on
  # Samsung devices (reel taps here never reached Dart at all on an S23
  # Ultra). Forcing the newer platform package directly is the only way
  # to actually pick up those upstream fixes.
  video_player_android: ^2.12.0
  video_compress: ^3.1.4
  video_trimmer: ^5.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Maps — OpenStreetMap based (no API key / billing account needed)
  flutter_map: ^7.0.2
  flutter_map_animations: ^0.7.0
  latlong2: ^0.9.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  image_picker: ^1.0.7

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
    - assets/branding/
  fonts:
    - family: K24Bold
      fonts:
        - asset: assets/fonts/K24KurdishBold-Bold.ttf
          weight: 700
    - family: Dashling
      fonts:
        - asset: assets/fonts/Quicksand_Dash.otf
    - family: Yellowtail
      fonts:
        - asset: assets/fonts/Yellowtail-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand_Light.otf
          weight: 300
        - asset: assets/fonts/Quicksand_Book.otf
          weight: 400
        - asset: assets/fonts/Quicksand_Bold.otf
          weight: 700
        - asset: assets/fonts/Quicksand_Light_Oblique.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Quicksand_Book_Oblique.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Quicksand_Bold_Oblique.otf
          weight: 700
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans_Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_Light_Italic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/PlusJakartaSans_Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans_Bold_Italic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_transparent.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#F5F0E7"
