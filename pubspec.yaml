name: shikodar
description: "شکۆدار — ئەپی خانووبەرەی کەرکوک"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management
  provider: ^6.1.1

  # Localization (ku / ar / en)
  easy_localization: ^3.0.5

  # UI / Media
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Maps — OpenStreetMap based (no API key / billing account needed)
  flutter_map: ^7.0.2
  flutter_map_animations: ^0.7.0
  latlong2: ^0.9.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Push notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
  fonts:
    - family: K24Bold
      fonts:
        - asset: assets/fonts/K24KurdishBold-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand_Light.otf
          weight: 300
        - asset: assets/fonts/Quicksand_Book.otf
          weight: 400
        - asset: assets/fonts/Quicksand_Bold.otf
          weight: 700
        - asset: assets/fonts/Quicksand_Light_Oblique.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Quicksand_Book_Oblique.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Quicksand_Bold_Oblique.otf
          weight: 700
          style: italic
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans_Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_Light_Italic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/PlusJakartaSans_Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans_Bold_Italic.ttf
          weight: 700
          style: italic
